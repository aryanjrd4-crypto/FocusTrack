<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0f;
      color: #e2e8f0;
      padding: 20px;
    }
    h1 {
      font-size: 20px;
      background: linear-gradient(to right, #818cf8, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 16px; }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #12121a;
      color: white;
      font-size: 14px;
    }
    input:focus { outline: none; border-color: #6366f1; }
    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(to right, #6366f1, #ec4899);
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { opacity: 0.9; }
    .error {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.3);
      color: #f87171;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .status {
      background: #12121a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .green { color: #34d399; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>FocusTrack</h1>
  <p class="subtitle">Track focus. Earn points.</p>

  <!-- Login Form -->
  <div id="loginSection">
    <div id="error" class="error hidden"></div>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button id="loginBtn">Login</button>
  </div>

  <!-- Logged In Status -->
  <div id="statusSection" class="hidden">
    <div class="status">
      <div class="status-row">
        <span>Status</span>
        <span id="trackingStatus" class="green">Active</span>
      </div>
      <div class="status-row">
        <span>Logged in as</span>
        <span id="userEmail">—</span>
      </div>
    </div>
    <button id="logoutBtn" style="margin-top: 12px; background: #1e1e2e; border: 1px solid rgba(255,255,255,0.1);">
      Logout
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
